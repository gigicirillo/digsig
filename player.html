<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DigSig Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,Arial,sans-serif}#stage{width:100%;height:100%;position:relative;background:#000;color:#fff}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:5vw;box-sizing:border-box}.slide-inner{max-width:1100px}.headline{font-size:clamp(46px,8vw,140px);font-weight:800;letter-spacing:-.05em;line-height:.9}.subheadline{font-size:clamp(18px,2.2vw,38px);opacity:.82;margin-top:28px;line-height:1.3}.media{width:100%;height:100%;object-fit:cover}.web{width:100%;height:100%;border:0;background:#000}.youtube-frame{pointer-events:none;user-select:none}.badge{position:fixed;right:16px;bottom:12px;font-size:11px;opacity:.35;z-index:4;color:#fff}.error{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:#fff;background:#111;box-sizing:border-box}.boot{display:grid;place-items:center;height:100%;color:#fff;background:#000;font-size:18px;letter-spacing:.04em}.media-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:20;overflow:hidden}.media-progress-bar{width:100%;height:100%;background:rgba(255,255,255,.9);transform:scaleX(0);transform-origin:left center}.media-progress-bar.running{animation-name:digsig-progress;animation-timing-function:linear;animation-fill-mode:forwards}@keyframes digsig-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}.design-zone-preview{position:absolute;overflow:hidden;background:#000}.design-zone-preview iframe,.design-zone-preview img,.design-zone-preview video{display:block;width:100%;height:100%;border:0;object-fit:cover}.design-zone-preview .slide{position:absolute;inset:0}.design-zone-preview .media-progress{position:absolute}
  </style>
</head>
<body>
  <div id="stage"><div class="boot">DigSig · caricamento player…</div></div>
  <div class="badge" id="badge">DigSig</div>
  <script>
    window.addEventListener('error',function(e){
      var stage=document.getElementById('stage');
      if(stage&&stage.querySelector('.boot')){
        stage.innerHTML='<div class="error"><div><h1>Errore avvio DigSig</h1><p>'+String(e.message||'JavaScript non caricato')+'</p></div></div>';
      }
    });
  </script>
  <script src="assets/js/player.js?v=20260909-1154"></script>
  <script src="assets/js/design-player.js?v=20260909-1154"></script>
</body>
</html>
