<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DigSig Player</title>
  <link rel="stylesheet" href="assets/css/widgets.css?v=20260910-0060" />
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,Arial,sans-serif}#stage{width:100%;height:100%;position:relative;background:#000;color:#fff}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:5vw;box-sizing:border-box}.slide-inner{max-width:1100px}.headline{font-size:clamp(46px,8vw,140px);font-weight:800;letter-spacing:-.05em;line-height:.9}.subheadline{font-size:clamp(18px,2.2vw,38px);opacity:.82;margin-top:28px;line-height:1.3}.media{width:100%;height:100%;object-fit:cover}.web{width:100%;height:100%;border:0;background:#000}.youtube-frame{pointer-events:none;user-select:none}.badge{position:fixed;right:16px;bottom:12px;font-size:11px;opacity:.35;z-index:4;color:#fff}.error{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:#fff;background:#111;box-sizing:border-box}.boot{display:grid;place-items:center;height:100%;color:#fff;background:#000;font-size:18px;letter-spacing:.04em}
    .design-zone-preview{position:absolute;overflow:hidden;background:#000;container-type:size}.design-zone-preview iframe,.design-zone-preview video{display:block;width:100%;height:100%;border:0;object-fit:cover}.design-zone-preview img{display:block;width:100%;height:100%;border:0;object-fit:contain;object-position:center center}.design-zone-preview .slide{position:absolute;inset:0;padding:clamp(5px,5cqw,40px)}.design-zone-preview .slide-inner{width:100%;max-width:none;overflow:hidden}.design-zone-preview .headline{font-size:clamp(12px,min(13cqw,20cqh),110px);line-height:.92;overflow-wrap:anywhere}.design-zone-preview .subheadline{font-size:clamp(8px,min(5.5cqw,8cqh),36px);margin-top:clamp(3px,2cqh,20px);line-height:1.15;overflow-wrap:anywhere}.design-zone-preview .weather-widget,.design-zone-preview .weather-widget-error{width:100%;height:100%;min-height:0;border-radius:0}.design-zone-preview .error{padding:clamp(4px,4cqw,20px);font-size:clamp(8px,min(4cqw,5cqh),18px)}
    @container (max-height:130px){.design-zone-preview .headline{font-size:min(11cqw,28cqh)}.design-zone-preview .subheadline{font-size:min(5cqw,12cqh);margin-top:2px}.design-zone-preview .slide{padding:4px 8px}}
  </style>
</head>
<body>
  <div id="stage"><div class="boot">DigSig · caricamento player…</div></div>
  <div class="badge" id="badge">DigSig</div>
  <script>window.addEventListener('error',function(e){var stage=document.getElementById('stage');if(stage&&stage.querySelector('.boot'))stage.innerHTML='<div class="error"><div><h1>Errore avvio DigSig</h1><p>'+String(e.message||'JavaScript non caricato')+'</p></div></div>'});</script>
  <script src="assets/js/player.js?v=20260910-0060"></script>
  <script src="assets/js/design-player.js?v=20260910-0060"></script>
</body>
</html>
