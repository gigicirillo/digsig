<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DigSig Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,Arial,sans-serif}#stage{width:100%;height:100%;position:relative;background:#000;color:#fff}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:5vw;box-sizing:border-box}.slide-inner{max-width:1100px}.headline{font-size:clamp(46px,8vw,140px);font-weight:800;letter-spacing:-.05em;line-height:.9}.subheadline{font-size:clamp(18px,2.2vw,38px);opacity:.82;margin-top:28px;line-height:1.3}.media{width:100%;height:100%;object-fit:cover}.web{width:100%;height:100%;border:0;background:#fff}.badge{position:fixed;right:16px;bottom:12px;font-size:11px;opacity:.35;z-index:4}.error{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:#fff;background:#111}
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="badge" id="badge">DigSig</div>
  <script src="assets/js/player.js"></script>
</body>
</html>
