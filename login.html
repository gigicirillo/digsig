<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Lynca.Tv</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#0b0d10;color:#f5f7fa}body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(420px,100%);background:#13171c;border:1px solid #252c34;border-radius:22px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}.mark{width:46px;height:46px;border-radius:14px;background:#66e3a4;color:#07110c;display:grid;place-items:center;font-size:24px;font-weight:800}.brand strong{display:block;font-size:22px}.brand span{display:block;color:#8d98a5;font-size:12px;margin-top:2px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#8d98a5;margin:0 0 7px}h1{font-size:27px;margin:0 0 25px}label{display:block;font-size:13px;color:#b6bec8;margin:0 0 16px}input{display:block;width:100%;margin-top:7px;background:#0e1217;border:1px solid #252c34;color:#fff;border-radius:11px;padding:13px 14px;font:inherit;outline:none}input:focus{border-color:#66e3a4}button{width:100%;border:0;border-radius:11px;padding:13px 16px;background:#66e3a4;color:#07110c;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px}.error{display:none;margin:0 0 16px;padding:11px 13px;border-radius:10px;background:#32191b;color:#ffb5b5;font-size:13px}.foot{text-align:center;color:#68727d;font-size:11px;margin-top:24px}</style></head><body><main class="login"><div class="brand"><div class="mark">L</div><div><strong>Lynca.Tv</strong><span>Digital Signage</span></div></div><p class="eyebrow">CONTROL CENTER</p><h1>Accedi alla dashboard</h1><div id="error" class="error">Username o password non corretti.</div><form id="loginForm"><label>Username<input id="username" autocomplete="username" required autofocus></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Accedi</button></form><div class="foot">Lynca.Tv · area riservata</div></main><script>(function(){const AUTH='carosello-dashboard-auth',USER='admin',HASH='fd33a3665d8c44417b88e24eb8f3d5c96867021ba218336ca6df9831247e7317';if(sessionStorage.getItem(AUTH)==='1')location.replace('index.html');async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;try{if(u===USER&&await sha(p)===HASH){sessionStorage.setItem(AUTH,'1');location.replace('index.html');return}}catch{}document.getElementById('error').style.display='block';document.getElementById('password').value='';document.getElementById('password').focus()})})();</script></body></html>
